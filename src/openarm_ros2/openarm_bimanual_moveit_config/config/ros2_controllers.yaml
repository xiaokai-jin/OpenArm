# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: position_controllers/GripperActionController
      

    right_gripper_controller:
      type: position_controllers/GripperActionController
      
    # left_side_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    # right_side_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    # upper_body_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 添加用于动态调节 kp/kd 参数的透传控制器
    stiffness_controller:
      type: forward_command_controller/ForwardCommandController
    
    damping_controller:
      type: forward_command_controller/ForwardCommandController

    left_gravity_compensation_controller:
      type: forward_command_controller/ForwardCommandController

    right_gravity_compensation_controller:
      type: forward_command_controller/ForwardCommandController

left_arm_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
right_arm_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1
    goal_tolerance: 0.05
    allow_stalling: true
    stall_timeout: 0.2
    stall_velocity_threshold: 0.001
right_gripper_controller:
  ros__parameters:
    joint: openarm_right_finger_joint1
    goal_tolerance: 0.05
    allow_stalling: true
    stall_timeout: 0.2
    stall_velocity_threshold: 0.001
